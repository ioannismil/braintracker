name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build frontend
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build app
        run: npx tauri build --no-bundle

      - name: Install tauri-driver
        shell: bash
        run: command -v tauri-driver || cargo install tauri-driver --locked

      # Drives the real app (windows, buttons, keys, bt) in a portable copy with its own data.
      # Tests that need a real desktop (system-wide shortcuts etc.) are skipped here.
      - name: End-to-end tests
        run: npm run e2e -- --ci

      - name: Upload screenshots of failed end-to-end tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: e2e/out
