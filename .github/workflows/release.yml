name: Release

# Every push to main ships a new release: an installer plus a portable zip, and the Android
# app (an .apk, added to the same release by the android job below).
# Version = <major.minor from tauri.conf.json>.<workflow run number>, e.g. v0.1.42.
# Docs-only changes don't trigger a release; add [skip ci] to a commit message to skip one.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/dependabot.yml"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags, for the changelog

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Compute version
        id: version
        shell: bash
        run: |
          base=$(node -p "require('./src-tauri/tauri.conf.json').version.split('.').slice(0,2).join('.')")
          version="$base.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"    >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Install dependencies
        run: npm ci

      - name: Stamp version
        run: node scripts/set-version.mjs ${{ steps.version.outputs.version }}

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build app & installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            # Signed updater artifacts (.sig) so installed apps can auto-update
            npx tauri build --config src-tauri/tauri.release.conf.json
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY secret is not set — building without auto-update files."
            npx tauri build
          fi

      - name: Package installer + portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force out | Out-Null

          Copy-Item "src-tauri/target/release/bundle/nsis/BrainTracker_${v}_x64-setup.exe" "out/"

          $stage = "portable/BrainTracker"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "src-tauri/target/release/braintracker.exe" "$stage/BrainTracker.exe"
          # bt.exe, the console command line (tauri build bundles it into the installer by itself)
          Copy-Item "src-tauri/target/release/bt.exe" "$stage/bt.exe"
          @(
            "BrainTracker portable"
            ""
            "This file switches BrainTracker into portable mode: your entries, screenshots"
            "and settings are stored in the 'data' folder next to BrainTracker.exe,"
            "so you can carry the whole folder on a USB stick."
            ""
            "Delete this file to make the exe use the normal installed location"
            "(%APPDATA%\com.braintracker.app) instead."
          ) | Set-Content -Encoding utf8 "$stage/portable.txt"
          Compress-Archive -Path $stage -DestinationPath "out/BrainTracker_${v}_x64_portable.zip"

          # Auto-update manifest: installed apps read releases/latest/download/latest.json
          $sig = "src-tauri/target/release/bundle/nsis/BrainTracker_${v}_x64-setup.exe.sig"
          if (Test-Path $sig) {
            $repo = "${{ github.repository }}"
            $manifest = [ordered]@{
              version   = $v
              notes     = "https://github.com/$repo/releases/tag/v$v"
              pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = [ordered]@{
                "windows-x86_64" = [ordered]@{
                  signature = (Get-Content -Raw $sig).Trim()
                  url       = "https://github.com/$repo/releases/download/v$v/BrainTracker_${v}_x64-setup.exe"
                }
              }
            }
            $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM "out/latest.json"
            Copy-Item $sig "out/"
          }

          Get-ChildItem out | Format-Table Name, Length

      - name: Write release notes
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          {
            echo "## Download"
            echo
            echo "| | File |"
            echo "|---|---|"
            echo "| **Installer** (recommended — adds Start menu entry, starts with Windows) | \`BrainTracker_${v}_x64-setup.exe\` |"
            echo "| **Portable** (no install — unzip and run, data stays in the folder) | \`BrainTracker_${v}_x64_portable.zip\` |"
            echo
            echo "> Windows may show *“Windows protected your PC”* because the app isn’t code-signed. Click **More info → Run anyway**."
            echo
            echo "## Changes"
            echo
            git log "$range" --no-merges --pretty="- %s (%h)"
            if [ -n "$prev" ]; then
              echo
              echo "**Full diff:** https://github.com/${{ github.repository }}/compare/$prev...v$v"
            fi
          } > notes.md
          cat notes.md

      - name: Remove release from a previous attempt of this run
        if: github.run_attempt != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ steps.version.outputs.tag }}" --cleanup-tag --yes || true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: BrainTracker ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            out/*.exe
            out/*.zip
            out/*.sig
            out/latest.json

  android:
    name: Android app
    needs: release
    # Linux: Tauri links the app's library into the Android project with a symlink, which
    # Windows only allows in Developer Mode.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install the Android NDK
        run: |
          sdkmanager --install "ndk;27.1.12297006"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - name: Install dependencies
        run: npm ci

      - name: Stamp version
        run: node scripts/set-version.mjs ${{ needs.release.outputs.version }}

      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.jks"
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$ks"
            pw="$ANDROID_KEYSTORE_PASSWORD"
          else
            echo "::warning::ANDROID_KEYSTORE secret is not set — the APK is signed with a one-off key, so the next release won't install over it (uninstall first)."
            pw=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -alias braintracker -keyalg RSA -keysize 4096 \
              -validity 36500 -storepass "$pw" -keypass "$pw" -dname "CN=BrainTracker"
          fi
          {
            echo "keyAlias=braintracker"
            echo "password=$pw"
            echo "storeFile=$ks"
          } > src-tauri/gen/android/keystore.properties

      - name: Build the APK
        run: npx tauri android build --apk --target aarch64 armv7 x86_64

      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -1)
          [ -n "$apk" ] || { echo "no APK was built"; exit 1; }
          out="BrainTracker_${{ needs.release.outputs.version }}_android.apk"
          cp "$apk" "$out"
          gh release upload "${{ needs.release.outputs.tag }}" "$out" --clobber
